<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap">
<style>
  :root{ --ink:#080D18; --signal:#2F55E8; --paper:#F1F3F7; --slate:#5B6472; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:#FFFFFF; }
  body{ font-family:'Inter',ui-sans-serif,system-ui,sans-serif; }
  .card{ width:1080px; margin:0 auto; background:var(--paper); color:var(--ink); padding:64px 66px 48px; display:flex; flex-direction:column; gap:30px; }
  .head-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:20px; }
  .head-copy{ display:flex; flex-direction:column; gap:10px; max-width:85%; }
  .card-eyebrow{ font-size:15px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--signal); }
  .card-h1{ font-size:31px; font-weight:800; line-height:1.22; letter-spacing:-.01em; color:var(--ink); text-wrap:balance; }
  .mark{ width:36px; height:36px; flex-shrink:0; margin-top:2px; }
  .diagram-wrap{ width:100%; }
  .diagram-wrap svg{ display:block; width:100%; height:auto; }
  figcaption{ margin-top:14px; font-size:17px; line-height:1.55; color:var(--slate); }
  figcaption b{ color:var(--ink); }
  figure{ margin:0; }
  .legend{ display:flex; gap:26px; flex-wrap:wrap; font-size:15px; font-weight:600; color:var(--slate); }
  .legend span{ display:inline-flex; align-items:center; gap:8px; }
  .legend svg{ width:30px; height:14px; overflow:visible; }
  .footer-row{ display:flex; align-items:center; justify-content:space-between; padding-top:20px; border-top:1px solid rgba(8,13,24,.1); }
  .wordmark{ font-size:16px; font-weight:700; letter-spacing:.06em; color:var(--ink); }
  .signature{ font-size:16px; font-weight:500; color:var(--slate); }
</style>

<div class="card">

  <div class="head-row">
    <div class="head-copy">
      <div class="card-eyebrow">Define a consistency boundary</div>
      <div class="card-h1">The critical path protects correctness; everything else consumes it later</div>
    </div>
    <svg class="mark" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"><g transform="matrix(7.111111111111111,0,0,7.111111111111111,-99.55555555555554,-99.55555555555554)"><g transform="rotate(0 50 50)"><path d="M57.0 14.0 H19.5 A5.5 5.5 0 0 0 14.0 19.5 V41.0 H25.0 V25.0 H57.0 Z" fill="#2F55E8"/></g><g transform="rotate(90 50 50)"><path d="M57.0 14.0 H19.5 A5.5 5.5 0 0 0 14.0 19.5 V41.0 H25.0 V25.0 H57.0 Z" fill="#080D18"/></g><g transform="rotate(180 50 50)"><path d="M57.0 14.0 H19.5 A5.5 5.5 0 0 0 14.0 19.5 V41.0 H25.0 V25.0 H57.0 Z" fill="#080D18"/></g><g transform="rotate(270 50 50)"><path d="M57.0 14.0 H19.5 A5.5 5.5 0 0 0 14.0 19.5 V41.0 H25.0 V25.0 H57.0 Z" fill="#080D18"/></g></g></svg>
  </div>

  <figure class="diagram-wrap">
    <svg viewBox="0 0 1080 620" role="img" aria-label="A payment request flows into a strongly-consistent payment boundary holding transaction state and financial invariants, which writes to a source of truth split into an outbox event and the ledger. The outbox fans out asynchronously to notifications, analytics, search, and reporting.">

      <defs>
        <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto">
          <path d="M0,0 L7,3.5 L0,7 Z" fill="#080D18"/>
        </marker>
        <marker id="arrEv" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto">
          <path d="M0,0 L7,3.5 L0,7 Z" fill="#5B6472"/>
        </marker>
      </defs>

      <rect x="390" y="20" width="300" height="54" rx="10" fill="#FFFFFF" stroke="#080D18" stroke-width="1.4"/>
      <text x="540" y="53" text-anchor="middle" font-size="15" font-weight="700" fill="#080D18">Payment Request</text>

      <line x1="540" y1="74" x2="540" y2="118" stroke="#080D18" stroke-width="1.6" marker-end="url(#arrB)"/>

      <rect x="330" y="120" width="420" height="130" rx="14" fill="#2F55E8" fill-opacity=".09" stroke="#2F55E8" stroke-width="2"/>
      <text x="540" y="146" text-anchor="middle" font-size="13" font-weight="800" letter-spacing=".07em" fill="#2F55E8">PAYMENT BOUNDARY &middot; strongly consistent</text>
      <rect x="360" y="160" width="170" height="70" rx="9" fill="#FFFFFF" stroke="#2F55E8" stroke-width="1.4"/>
      <text x="445" y="200" text-anchor="middle" font-size="13.5" font-weight="700" fill="#080D18">Transaction State</text>
      <rect x="550" y="160" width="170" height="70" rx="9" fill="#FFFFFF" stroke="#2F55E8" stroke-width="1.4"/>
      <text x="635" y="192" text-anchor="middle" font-size="13.5" font-weight="700" fill="#080D18">Financial</text>
      <text x="635" y="210" text-anchor="middle" font-size="13.5" font-weight="700" fill="#080D18">Invariants</text>

      <line x1="540" y1="250" x2="540" y2="294" stroke="#080D18" stroke-width="1.6" marker-end="url(#arrB)"/>

      <rect x="410" y="296" width="260" height="54" rx="10" fill="#FFFFFF" stroke="#080D18" stroke-width="1.4"/>
      <text x="540" y="329" text-anchor="middle" font-size="14.5" font-weight="700" fill="#080D18">Source of Truth</text>

      <line x1="480" y1="350" x2="330" y2="392" stroke="#080D18" stroke-width="1.5" marker-end="url(#arrB)"/>
      <line x1="600" y1="350" x2="750" y2="392" stroke="#080D18" stroke-width="1.5" marker-end="url(#arrB)"/>

      <rect x="180" y="394" width="220" height="56" rx="9" fill="#FFFFFF" stroke="#080D18" stroke-width="1.4"/>
      <text x="290" y="428" text-anchor="middle" font-size="13.5" font-weight="700" fill="#080D18">Outbox Event</text>

      <rect x="680" y="394" width="220" height="56" rx="9" fill="#FFFFFF" stroke="#080D18" stroke-width="1.4"/>
      <text x="790" y="428" text-anchor="middle" font-size="13.5" font-weight="700" fill="#080D18">Ledger</text>

      <g stroke="#5B6472" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrEv)" fill="none">
        <path d="M240,452 L110,540"/>
        <path d="M270,452 L280,540"/>
        <path d="M310,452 L460,540"/>
        <path d="M340,452 L630,540"/>
      </g>

      <g font-family="Inter, sans-serif">
        <rect x="40" y="542" width="150" height="60" rx="9" fill="#F1F3F7" stroke="#5B6472" stroke-width="1.2"/>
        <text x="115" y="578" text-anchor="middle" font-size="12.5" font-weight="700" fill="#080D18">Notify</text>

        <rect x="210" y="542" width="150" height="60" rx="9" fill="#F1F3F7" stroke="#5B6472" stroke-width="1.2"/>
        <text x="285" y="578" text-anchor="middle" font-size="12.5" font-weight="700" fill="#080D18">Analytics</text>

        <rect x="390" y="542" width="150" height="60" rx="9" fill="#F1F3F7" stroke="#5B6472" stroke-width="1.2"/>
        <text x="465" y="578" text-anchor="middle" font-size="12.5" font-weight="700" fill="#080D18">Search</text>

        <rect x="560" y="542" width="150" height="60" rx="9" fill="#F1F3F7" stroke="#5B6472" stroke-width="1.2"/>
        <text x="635" y="578" text-anchor="middle" font-size="12.5" font-weight="700" fill="#080D18">Reporting</text>
      </g>

      <text x="960" y="580" text-anchor="middle" font-size="12" font-weight="700" fill="#5B6472">eventually</text>
      <text x="960" y="598" text-anchor="middle" font-size="12" font-weight="700" fill="#5B6472">consistent</text>

    </svg>

    <figcaption>Everything above the dashed arrows must agree <b>before</b> the response returns. Everything below can catch up on its own schedule &mdash; that's the boundary, and it's drawn around the invariant, not around a service org chart.</figcaption>
  </figure>

  <div class="legend">
    <span><svg viewBox="0 0 22 10"><line x1="0" y1="5" x2="18" y2="5" stroke="#080D18" stroke-width="1.6" marker-end="url(#arrB)"/></svg> strongly consistent</span>
    <span><svg viewBox="0 0 22 10"><line x1="0" y1="5" x2="18" y2="5" stroke="#5B6472" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrEv)"/></svg> eventually consistent</span>
  </div>

  <div class="footer-row">
    <div class="wordmark">THE FINTECH ENGINEER</div>
    <div class="signature">thefintechengineer.substack.com</div>
  </div>

</div>
