<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap">
<style>
  :root{
    --ink:#080D18;
    --signal:#2F55E8;
    --paper:#F1F3F7;
    --slate:#5B6472;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:#FFFFFF; }
  body{
    font-family:'Inter',ui-sans-serif,system-ui,sans-serif;
  }

  .card{
    width:1080px;
    margin:0 auto;
    background:var(--paper);
    color:var(--ink);
    padding:64px 66px 48px;
    display:flex;
    flex-direction:column;
    gap:30px;
  }

  .head-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:20px; }
  .head-copy{ display:flex; flex-direction:column; gap:10px; max-width:80%; }
  .card-eyebrow{ font-size:15px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--signal); }
  .card-h1{ font-size:31px; font-weight:800; line-height:1.22; letter-spacing:-.01em; color:var(--ink); text-wrap:balance; }
  .mark{ width:36px; height:36px; flex-shrink:0; margin-top:2px; }

  .diagram-wrap{ width:100%; }
  .diagram-wrap svg{ display:block; width:100%; height:auto; }
  figcaption{ margin-top:14px; font-size:17px; line-height:1.55; color:var(--slate); }
  figcaption b{ color:var(--ink); }
  figure{ margin:0; }

  .legend{ display:flex; gap:26px; flex-wrap:wrap; font-size:15px; font-weight:600; color:var(--slate); }
  .legend span{ display:inline-flex; align-items:center; gap:8px; }
  .legend svg{ width:30px; height:14px; overflow:visible; }

  .footer-row{
    display:flex; align-items:center; justify-content:space-between;
    padding-top:20px; border-top:1px solid rgba(8,13,24,.1);
  }
  .wordmark{ font-size:16px; font-weight:700; letter-spacing:.06em; color:var(--ink); }
  .signature{ font-size:16px; font-weight:500; color:var(--slate); }
</style>

<div class="card">

  <div class="head-row">
    <div class="head-copy">
      <div class="card-eyebrow">Race trace &middot; two withdrawals, one balance</div>
      <div class="card-h1">Two correct reads still approved $4,000 that wasn't there</div>
    </div>
    <svg class="mark" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"><g transform="matrix(7.111111111111111,0,0,7.111111111111111,-99.55555555555554,-99.55555555555554)"><g transform="rotate(0 50 50)"><path d="M57.0 14.0 H19.5 A5.5 5.5 0 0 0 14.0 19.5 V41.0 H25.0 V25.0 H57.0 Z" fill="#2F55E8"/></g><g transform="rotate(90 50 50)"><path d="M57.0 14.0 H19.5 A5.5 5.5 0 0 0 14.0 19.5 V41.0 H25.0 V25.0 H57.0 Z" fill="#080D18"/></g><g transform="rotate(180 50 50)"><path d="M57.0 14.0 H19.5 A5.5 5.5 0 0 0 14.0 19.5 V41.0 H25.0 V25.0 H57.0 Z" fill="#080D18"/></g><g transform="rotate(270 50 50)"><path d="M57.0 14.0 H19.5 A5.5 5.5 0 0 0 14.0 19.5 V41.0 H25.0 V25.0 H57.0 Z" fill="#080D18"/></g></g></svg>
  </div>

  <figure class="diagram-wrap">
    <svg viewBox="0 0 1080 620" role="img" aria-label="Trace showing two payment service instances both reading a $10,000 balance at the same instant, both approving a $7,000 withdrawal, and both committing — leaving $14,000 approved against $10,000 available.">

      <defs>
        <marker id="arrowSolid" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
          <path d="M0,0 L8,4 L0,8 Z" fill="#080D18"/>
        </marker>
        <marker id="arrowDanger" markerWidth="10" markerHeight="10" refX="7" refY="4.5" orient="auto">
          <path d="M0,0 L8,4.5 L0,9 Z" fill="#2F55E8"/>
        </marker>
      </defs>

      <g font-family="Inter, sans-serif">
        <rect x="55" y="14" width="230" height="50" rx="9" fill="#FFFFFF" stroke="#080D18" stroke-width="1.4"/>
        <text x="170" y="36" text-anchor="middle" font-size="14" font-weight="700" fill="#080D18">Instance A</text>
        <text x="170" y="53" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5B6472">withdraw $7,000</text>

        <rect x="425" y="14" width="230" height="50" rx="9" fill="#FFFFFF" stroke="#080D18" stroke-width="1.4"/>
        <text x="540" y="36" text-anchor="middle" font-size="14" font-weight="700" fill="#080D18">Account Balance</text>
        <text x="540" y="53" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5B6472">shared state, $10,000</text>

        <rect x="795" y="14" width="230" height="50" rx="9" fill="#FFFFFF" stroke="#080D18" stroke-width="1.4"/>
        <text x="910" y="36" text-anchor="middle" font-size="14" font-weight="700" fill="#080D18">Instance B</text>
        <text x="910" y="53" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5B6472">withdraw $7,000</text>
      </g>

      <line x1="170" y1="64" x2="170" y2="560" stroke="#080D18" stroke-opacity=".25" stroke-width="1.5" stroke-dasharray="2 4"/>
      <line x1="540" y1="64" x2="540" y2="560" stroke="#080D18" stroke-opacity=".25" stroke-width="1.5" stroke-dasharray="2 4"/>
      <line x1="910" y1="64" x2="910" y2="560" stroke="#080D18" stroke-opacity=".25" stroke-width="1.5" stroke-dasharray="2 4"/>

      <g font-family="Inter, sans-serif">

        <line x1="536" y1="108" x2="176" y2="108" stroke="#080D18" stroke-width="1.8" marker-end="url(#arrowSolid)"/>
        <line x1="544" y1="108" x2="904" y2="108" stroke="#080D18" stroke-width="1.8" marker-end="url(#arrowSolid)"/>
        <text x="345" y="98" text-anchor="middle" font-size="12" font-weight="600" fill="#080D18">SELECT balance</text>
        <text x="345" y="124" text-anchor="middle" font-size="10" font-weight="600" font-style="italic" fill="#5B6472">reads $10,000</text>
        <text x="735" y="98" text-anchor="middle" font-size="12" font-weight="600" fill="#080D18">SELECT balance</text>
        <text x="735" y="124" text-anchor="middle" font-size="10" font-weight="600" font-style="italic" fill="#5B6472">reads $10,000</text>

        <line x1="40" y1="168" x2="1040" y2="168" stroke="#2F55E8" stroke-width="1.4" stroke-dasharray="5 4"/>
        <rect x="440" y="158" width="200" height="20" fill="#F1F3F7"/>
        <text x="540" y="173" text-anchor="middle" font-size="12" font-weight="700" fill="#2F55E8" letter-spacing=".04em">SAME INSTANT</text>

        <text x="170" y="222" text-anchor="middle" font-size="11.5" font-weight="700" fill="#080D18">check: $10,000 &#8805; $7,000</text>
        <text x="170" y="240" text-anchor="middle" font-size="10" font-weight="600" fill="#5B6472">approved</text>
        <text x="910" y="222" text-anchor="middle" font-size="11.5" font-weight="700" fill="#080D18">check: $10,000 &#8805; $7,000</text>
        <text x="910" y="240" text-anchor="middle" font-size="10" font-weight="600" fill="#5B6472">approved</text>

        <line x1="176" y1="290" x2="536" y2="290" stroke="#2F55E8" stroke-width="2.4" marker-end="url(#arrowDanger)"/>
        <line x1="904" y1="290" x2="544" y2="290" stroke="#2F55E8" stroke-width="2.4" marker-end="url(#arrowDanger)"/>
        <text x="345" y="280" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2F55E8">COMMIT &minus;$7,000</text>
        <text x="735" y="280" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2F55E8">COMMIT &minus;$7,000</text>

        <rect x="345" y="330" width="390" height="46" rx="8" fill="#FFFFFF" stroke="#2F55E8" stroke-width="1.2"/>
        <text x="540" y="352" text-anchor="middle" font-size="11.5" font-weight="700" fill="#080D18">Both writes succeed independently</text>
        <text x="540" y="368" text-anchor="middle" font-size="10" font-weight="600" fill="#5B6472">neither instance ever saw the other's write</text>

      </g>

      <rect x="70" y="470" width="940" height="80" rx="10" fill="#2F55E8" fill-opacity=".08" stroke="#2F55E8" stroke-width="1.4"/>
      <rect x="70" y="470" width="6" height="80" rx="3" fill="#2F55E8"/>
      <text x="100" y="498" font-size="13.5" font-weight="700" fill="#080D18">Approved: $14,000 &middot; Available: $10,000 &middot; Gap: $4,000.</text>
      <text x="100" y="517" font-size="12" font-weight="600" fill="#5B6472">No exception thrown. No service crashed. Every individual read was correct at the moment it ran.</text>
      <text x="100" y="536" font-size="12" font-weight="700" fill="#2F55E8">This is a broken invariant, not a lagging replica &mdash; there's nothing left to "eventually" converge toward.</text>

    </svg>

    <figcaption>The bug isn't in either instance &mdash; it's the gap between <b>read</b> and <b>write</b>. Anything that gates whether money moves needs the check pushed into the write itself, not decided from a snapshot that's already stale by the time it's acted on.</figcaption>
  </figure>

  <div class="legend">
    <span><svg viewBox="0 0 22 10"><line x1="0" y1="5" x2="18" y2="5" stroke="#080D18" stroke-width="1.8" marker-end="url(#arrowSolid)"/></svg> read</span>
    <span><svg viewBox="0 0 22 10"><line x1="0" y1="5" x2="18" y2="5" stroke="#2F55E8" stroke-width="2.4" marker-end="url(#arrowDanger)"/></svg> write / commit</span>
    <span><svg viewBox="0 0 22 10"><line x1="0" y1="5" x2="18" y2="5" stroke="#2F55E8" stroke-width="1.4" stroke-dasharray="4 3"/></svg> the race window</span>
  </div>

  <div class="footer-row">
    <div class="wordmark">THE FINTECH ENGINEER</div>
    <div class="signature">linkedin.com/company/the-fintech-engineer</div>
  </div>

</div>
