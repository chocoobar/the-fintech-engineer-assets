<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap">
<style>
  :root{
    --ink:#080D18;
    --signal:#2F55E8;
    --paper:#F1F3F7;
    --slate:#5B6472;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:#FFFFFF; }
  body{
    font-family:'Inter',ui-sans-serif,system-ui,sans-serif;
  }

  .card{
    width:1080px;
    margin:0 auto;
    background:var(--paper);
    color:var(--ink);
    padding:64px 66px 48px;
    display:flex;
    flex-direction:column;
    gap:30px;
  }

  .head-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:20px; }
  .head-copy{ display:flex; flex-direction:column; gap:10px; max-width:85%; }
  .card-eyebrow{ font-size:15px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--signal); }
  .card-h1{ font-size:34px; font-weight:800; line-height:1.2; letter-spacing:-.01em; color:var(--ink); text-wrap:balance; }
  .mark{ width:36px; height:36px; flex-shrink:0; margin-top:2px; }

  .diagram-wrap{ width:100%; }
  .diagram-wrap svg{ display:block; width:100%; height:auto; }
  figcaption{ margin-top:16px; font-size:17px; line-height:1.55; color:var(--slate); }
  figcaption b{ color:var(--ink); }
  figure{ margin:0; }

  .footer-row{
    display:flex; align-items:center; justify-content:space-between;
    padding-top:20px; border-top:1px solid rgba(8,13,24,.1);
  }
  .wordmark{ font-size:16px; font-weight:700; letter-spacing:.06em; color:var(--ink); }
  .signature{ font-size:16px; font-weight:500; color:var(--slate); }
</style>

<div class="card">

  <div class="head-row">
    <div class="head-copy">
      <div class="card-eyebrow">Reconciliation drift &middot; the numbers</div>
      <div class="card-h1">$10,000 captured. $9,800 settled. Both correct.</div>
    </div>
    <svg class="mark" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"><g transform="matrix(7.111111111111111,0,0,7.111111111111111,-99.55555555555554,-99.55555555555554)"><g transform="rotate(0 50 50)"><path d="M57.0 14.0 H19.5 A5.5 5.5 0 0 0 14.0 19.5 V41.0 H25.0 V25.0 H57.0 Z" fill="#2F55E8"/></g><g transform="rotate(90 50 50)"><path d="M57.0 14.0 H19.5 A5.5 5.5 0 0 0 14.0 19.5 V41.0 H25.0 V25.0 H57.0 Z" fill="#080D18"/></g><g transform="rotate(180 50 50)"><path d="M57.0 14.0 H19.5 A5.5 5.5 0 0 0 14.0 19.5 V41.0 H25.0 V25.0 H57.0 Z" fill="#080D18"/></g><g transform="rotate(270 50 50)"><path d="M57.0 14.0 H19.5 A5.5 5.5 0 0 0 14.0 19.5 V41.0 H25.0 V25.0 H57.0 Z" fill="#080D18"/></g></g></svg>
  </div>

  <figure class="diagram-wrap">
    <svg viewBox="0 0 1080 480" role="img" aria-label="Two panels: the ledger shows $10,000 captured, the bank shows $9,800 settled, a $200 gap badge between them, and four icons below for what a real reconciliation job checks: three-way match, stable IDs, rolling window, suspense account.">

      <rect x="60" y="20" width="440" height="280" rx="16" fill="#FFFFFF" stroke="#080D18" stroke-width="1.4"/>
      <text x="280" y="72" text-anchor="middle" font-size="14" font-weight="700" letter-spacing=".1em" fill="#2F55E8">LEDGER SAYS</text>
      <text x="280" y="190" text-anchor="middle" font-size="64" font-weight="800" fill="#080D18">$10,000</text>
      <text x="280" y="232" text-anchor="middle" font-size="14.5" font-weight="600" fill="#5B6472">captured &middot; day 1</text>

      <rect x="580" y="20" width="440" height="280" rx="16" fill="#FFFFFF" stroke="#080D18" stroke-width="1.4"/>
      <text x="800" y="72" text-anchor="middle" font-size="14" font-weight="700" letter-spacing=".1em" fill="#2F55E8">BANK SHOWS</text>
      <text x="800" y="190" text-anchor="middle" font-size="64" font-weight="800" fill="#2F55E8">$9,800</text>
      <text x="800" y="232" text-anchor="middle" font-size="14.5" font-weight="600" fill="#5B6472">settled &middot; day 3</text>

      <circle cx="540" cy="160" r="58" fill="#F1F3F7" stroke="#2F55E8" stroke-width="3"/>
      <text x="540" y="152" text-anchor="middle" font-size="20" font-weight="800" fill="#2F55E8">&#916;</text>
      <text x="540" y="180" text-anchor="middle" font-size="20" font-weight="800" fill="#2F55E8">$200</text>

      <g font-family="Inter, sans-serif">
        <circle cx="180" cy="378" r="24" fill="#2F55E8" fill-opacity=".08" stroke="#2F55E8" stroke-width="1.5"/>
        <path d="M170,378 L177,385 L191,369" stroke="#2F55E8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="180" y="432" text-anchor="middle" font-size="16" font-weight="700" fill="#080D18">3-way match</text>

        <circle cx="420" cy="378" r="24" fill="#2F55E8" fill-opacity=".08" stroke="#2F55E8" stroke-width="1.5"/>
        <path d="M410,378 L417,385 L431,369" stroke="#2F55E8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="420" y="432" text-anchor="middle" font-size="16" font-weight="700" fill="#080D18">Stable IDs</text>

        <circle cx="660" cy="378" r="24" fill="#2F55E8" fill-opacity=".08" stroke="#2F55E8" stroke-width="1.5"/>
        <path d="M650,378 L657,385 L671,369" stroke="#2F55E8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="660" y="432" text-anchor="middle" font-size="16" font-weight="700" fill="#080D18">Rolling window</text>

        <circle cx="900" cy="378" r="24" fill="#2F55E8" fill-opacity=".08" stroke="#2F55E8" stroke-width="1.5"/>
        <path d="M890,378 L897,385 L911,369" stroke="#2F55E8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="900" y="432" text-anchor="middle" font-size="16" font-weight="700" fill="#080D18">Suspense account</text>
      </g>

    </svg>

    <figcaption>A 2% gateway fee, deducted two days after capture, turns two <b>correct</b> numbers into an unreconciled gap &mdash; unless recon is built to expect it.</figcaption>
  </figure>

  <div class="footer-row">
    <div class="wordmark">THE FINTECH ENGINEER</div>
    <div class="signature">linkedin.com/company/the-fintech-engineer</div>
  </div>

</div>
