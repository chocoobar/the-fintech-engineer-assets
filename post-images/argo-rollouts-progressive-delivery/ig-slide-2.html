<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap">
<style>
  :root{
    --ink:#080D18;
    --signal:#2F55E8;
    --paper:#F1F3F7;
    --slate:#5B6472;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:#FFFFFF; }
  body{ font-family:'Inter',ui-sans-serif,system-ui,sans-serif; }

  .slide{
    width:1080px;
    height:1080px;
    margin:0 auto;
    background:var(--ink);
    color:var(--paper);
    padding:56px 64px 48px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  .head-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:20px; }
  .mark{ width:34px; height:34px; flex-shrink:0; }
  .card-eyebrow{ font-size:14px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--signal); }
  .swipe{ font-size:13px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--signal); }

  .content{ flex:1; display:flex; flex-direction:column; justify-content:center; }

  .stat{ font-size:56px; font-weight:800; line-height:1.12; letter-spacing:-.01em; margin:0; }
  .stat.paper{ color:var(--paper); }
  .stat.signal{ color:var(--signal); }

  .lede{ font-size:26px; font-weight:500; color:var(--paper); margin:0; }
  .sub{ font-size:20px; font-weight:400; line-height:1.5; color:var(--slate); margin:0; }

  .rule{ width:80px; height:4px; background:var(--signal); border:0; margin:0; }

  .footer-row{
    display:flex; align-items:center; justify-content:space-between;
    padding-top:18px; border-top:1px solid rgba(241,243,247,.14);
  }
  .wordmark{ font-size:16px; font-weight:700; letter-spacing:.06em; color:var(--paper); }
  .signature{ font-size:14px; font-weight:500; color:var(--slate); }

  .h1{ font-size:40px; font-weight:800; line-height:1.18; letter-spacing:-.01em; color:var(--paper); margin:0; }
  .diagram svg{ display:block; width:100%; height:auto; }
  .items{ display:flex; flex-direction:column; gap:26px; }
  .item{ display:flex; gap:22px; align-items:flex-start; }
  .num{ width:46px; height:46px; border-radius:50%; border:2px solid var(--signal); color:var(--signal); font-weight:800; font-size:22px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .item .t{ font-size:27px; font-weight:700; color:var(--paper); margin:0 0 6px; line-height:1.2; }
  .item .d{ font-size:21px; font-weight:400; color:#A9B1BF; margin:0; line-height:1.4; }
  .checklist{ display:flex; flex-direction:column; gap:24px; }
  .check-item{ display:flex; gap:16px; align-items:flex-start; }
  .check-item .arrow{ color:var(--signal); font-weight:800; font-size:23px; line-height:1.3; flex-shrink:0; }
  .check-item p{ margin:0; font-size:23px; font-weight:500; color:var(--paper); line-height:1.3; }
  .cta{ display:flex; flex-direction:column; gap:12px; background:rgba(47,85,232,0.16); border:1.5px solid var(--signal); border-radius:16px; padding:26px 28px; }
  .cta .title{ font-size:27px; font-weight:700; color:var(--paper); }
  .cta .link{ font-size:19px; font-weight:500; color:#8FA3F0; }
</style>

<div class="slide">

  <div class="head-row">
    <svg class="mark" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"><g transform="matrix(7.111111111111111,0,0,7.111111111111111,-99.55555555555554,-99.55555555555554)"><g transform="rotate(0 50 50)"><path d="M57.0 14.0 H19.5 A5.5 5.5 0 0 0 14.0 19.5 V41.0 H25.0 V25.0 H57.0 Z" fill="#2F55E8"/></g><g transform="rotate(90 50 50)"><path d="M57.0 14.0 H19.5 A5.5 5.5 0 0 0 14.0 19.5 V41.0 H25.0 V25.0 H57.0 Z" fill="#F1F3F7"/></g><g transform="rotate(180 50 50)"><path d="M57.0 14.0 H19.5 A5.5 5.5 0 0 0 14.0 19.5 V41.0 H25.0 V25.0 H57.0 Z" fill="#F1F3F7"/></g><g transform="rotate(270 50 50)"><path d="M57.0 14.0 H19.5 A5.5 5.5 0 0 0 14.0 19.5 V41.0 H25.0 V25.0 H57.0 Z" fill="#F1F3F7"/></g></g></svg>
    <div style="text-align:right; display:flex; flex-direction:column; gap:5px;">
      <div class="card-eyebrow">Argo Rollouts &middot; 2/5</div>
      <div class="swipe">Swipe &rarr;</div>
    </div>
  </div>

  <div class="content">
    <p class="h1" style="margin-bottom:26px;">Kubernetes asked "is the pod alive?"</p>
    <div class="diagram"><svg viewBox="-3 -3 958 646" role="img" aria-label="A rolling update replaces pods one by one. Every readiness probe passes, so Kubernetes keeps going until v2 serves 100 percent of traffic. v2 then returns HTTP 200 with DECLINED on about 8 percent of authorizations, no 5xx fires and alerts stay green. Nobody asked whether v2 is still approving payments.">
<defs><marker id="aP" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M0,0 L13,7 L0,14 Z" fill="#F1F3F7"/></marker><marker id="aS" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M0,0 L13,7 L0,14 Z" fill="#2F55E8"/></marker></defs>
<g font-family="Inter, sans-serif">
<rect x="0" y="0" width="600" height="84" rx="14" stroke="#F1F3F7" stroke-opacity=".7" stroke-width="2" fill="#0F1626"/><text x="26" y="37" font-size="26" font-weight="800" fill="#F1F3F7">v2 pods roll out</text><text x="26" y="66" font-size="20" font-weight="500" fill="#A9B1BF">replacing v1, one at a time</text>
<line x1="300" y1="84" x2="300" y2="138" stroke="#F1F3F7" stroke-width="3" marker-end="url(#aP)"/><text x="326" y="119.0" font-size="21" font-weight="700" fill="#F1F3F7">readiness probe</text>
<rect x="0" y="140" width="600" height="84" rx="14" stroke="#F1F3F7" stroke-opacity=".7" stroke-width="2" fill="#0F1626"/><text x="26" y="177" font-size="26" font-weight="800" fill="#F1F3F7">Every probe passes</text><text x="26" y="206" font-size="20" font-weight="500" fill="#A9B1BF">HTTP 200 on /healthz, Kubernetes keeps going</text>
<line x1="300" y1="224" x2="300" y2="278" stroke="#F1F3F7" stroke-width="3" marker-end="url(#aP)"/><text x="326" y="259.0" font-size="21" font-weight="700" fill="#F1F3F7">4 minutes later</text>
<rect x="0" y="280" width="600" height="84" rx="14" stroke="#F1F3F7" stroke-opacity=".7" stroke-width="2" fill="#0F1626"/><text x="26" y="317" font-size="26" font-weight="800" fill="#F1F3F7">v2 on 100% of traffic</text><text x="26" y="346" font-size="20" font-weight="500" fill="#A9B1BF">no canary, no gate</text>
<line x1="300" y1="364" x2="300" y2="418" stroke="#2F55E8" stroke-width="3" marker-end="url(#aS)"/><text x="326" y="399.0" font-size="21" font-weight="700" fill="#2F55E8">~8% of auths</text>
<rect x="0" y="420" width="600" height="84" rx="14" stroke="#2F55E8" stroke-width="3" fill="#2F55E8" fill-opacity=".16"/><text x="26" y="457" font-size="26" font-weight="800" fill="#F1F3F7">HTTP 200 + DECLINED</text><text x="26" y="486" font-size="20" font-weight="500" fill="#A9B1BF">5xx stays at 0, dashboards stay green</text>
<rect x="0" y="540" width="952" height="92" rx="14" fill="#2F55E8" fill-opacity=".14" stroke="#2F55E8" stroke-width="2.5"/>
<rect x="0" y="540" width="8" height="92" rx="4" fill="#2F55E8"/>
<text x="32" y="580" font-size="25" font-weight="800" fill="#F1F3F7">Nobody asked: is this version</text>
<text x="32" y="614" font-size="25" font-weight="800" fill="#F1F3F7">still approving payments?</text>
</g></svg></div>
  </div>

  <div class="footer-row">
    <div class="wordmark">THE FINTECH ENGINEER</div>
    <div class="signature">linkedin.com/company/the-fintech-engineer</div>
  </div>

</div>
