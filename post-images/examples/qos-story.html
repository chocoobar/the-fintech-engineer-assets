<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap">
<style>
  :root{
    --ink:#080D18;
    --signal:#2F55E8;
    --paper:#F1F3F7;
    --slate:#5B6472;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:#FFFFFF; }
  body{ font-family:'Inter',ui-sans-serif,system-ui,sans-serif; }

  .card{
    width:1080px;
    margin:0 auto;
    background:var(--paper);
    color:var(--ink);
    padding:64px 66px 48px;
    display:flex;
    flex-direction:column;
    gap:30px;
  }

  .head-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:20px; }
  .head-copy{ display:flex; flex-direction:column; gap:10px; max-width:80%; }
  .card-eyebrow{ font-size:15px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--signal); }
  .card-h1{ font-size:31px; font-weight:800; line-height:1.22; letter-spacing:-.01em; color:var(--ink); text-wrap:balance; }
  .mark{ width:36px; height:36px; flex-shrink:0; margin-top:2px; }

  .diagram-wrap{ width:100%; }
  .diagram-wrap svg{ display:block; width:100%; height:auto; }
  figcaption{ margin-top:14px; font-size:17px; line-height:1.55; color:var(--slate); }
  figcaption b{ color:var(--ink); }
  figure{ margin:0; }

  .footer-row{
    display:flex; align-items:center; justify-content:space-between;
    padding-top:20px; border-top:1px solid rgba(8,13,24,.1);
  }
  .wordmark{ font-size:16px; font-weight:700; letter-spacing:.06em; color:var(--ink); }
  .signature{ font-size:16px; font-weight:500; color:var(--slate); }
</style>

<div class="card">

  <div class="head-row">
    <div class="head-copy">
      <div class="card-eyebrow">A memory-pressure incident &middot; told in four panels</div>
      <div class="card-h1">What actually happens when a node runs out of room</div>
    </div>
    <svg class="mark" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"><g transform="matrix(7.111111111111111,0,0,7.111111111111111,-99.55555555555554,-99.55555555555554)"><g transform="rotate(0 50 50)"><path d="M57.0 14.0 H19.5 A5.5 5.5 0 0 0 14.0 19.5 V41.0 H25.0 V25.0 H57.0 Z" fill="#2F55E8"/></g><g transform="rotate(90 50 50)"><path d="M57.0 14.0 H19.5 A5.5 5.5 0 0 0 14.0 19.5 V41.0 H25.0 V25.0 H57.0 Z" fill="#080D18"/></g><g transform="rotate(180 50 50)"><path d="M57.0 14.0 H19.5 A5.5 5.5 0 0 0 14.0 19.5 V41.0 H25.0 V25.0 H57.0 Z" fill="#080D18"/></g><g transform="rotate(270 50 50)"><path d="M57.0 14.0 H19.5 A5.5 5.5 0 0 0 14.0 19.5 V41.0 H25.0 V25.0 H57.0 Z" fill="#080D18"/></g></g></svg>
  </div>

  <figure class="diagram-wrap">
    <svg viewBox="0 0 1080 840" role="img" aria-label="Four-panel storyboard: three pods share a node calmly; a pod with no memory request starts growing; the node crosses its memory-pressure threshold and kubelet marks that pod for eviction; the pod is evicted while the other two, which had requests set, survive.">

      <!-- ============ PANEL 1 · THE CAST (px=60, py=10) ============ -->
      <g font-family="Inter, sans-serif">
        <rect x="60" y="10" width="460" height="380" rx="14" fill="#FFFFFF" stroke="#080D18" stroke-opacity=".15" stroke-width="1.4"/>
        <text x="88" y="50" font-size="12.5" font-weight="800" letter-spacing=".06em" fill="#2F55E8">1 &middot; THE CAST</text>
        <text x="88" y="74" font-size="17" font-weight="800" fill="#080D18">Three pods share a node</text>

        <rect x="90" y="92" width="400" height="160" rx="10" fill="#F1F3F7" stroke="#080D18" stroke-opacity=".35" stroke-width="1.3"/>
        <text x="102" y="140" font-size="9.5" font-weight="700" letter-spacing=".08em" fill="#5B6472">NODE</text>
        <rect x="100" y="100" width="380" height="8" rx="4" fill="#E3E7EF"/>
        <rect x="100" y="100" width="95" height="8" rx="4" fill="#5B6472" fill-opacity=".55"/>

        <!-- chip A -->
        <text x="196" y="172" text-anchor="middle" font-size="13" font-weight="800" fill="#080D18">A</text>
        <rect x="162" y="178" width="68" height="92" rx="6" fill="#FFFFFF" stroke="#080D18" stroke-width="1.3"/>
        <rect x="162" y="224" width="68" height="46" fill="#5B6472" fill-opacity=".5"/>
        <text x="196" y="290" text-anchor="middle" font-size="9" font-weight="600" fill="#5B6472">no request set</text>

        <!-- chip B -->
        <text x="290" y="172" text-anchor="middle" font-size="13" font-weight="800" fill="#080D18">B</text>
        <rect x="256" y="178" width="68" height="92" rx="6" fill="#FFFFFF" stroke="#080D18" stroke-width="1.3"/>
        <rect x="256" y="214" width="68" height="56" fill="#5B6472" fill-opacity=".5"/>
        <text x="290" y="290" text-anchor="middle" font-size="9" font-weight="600" fill="#5B6472">request 256Mi</text>

        <!-- chip C -->
        <text x="384" y="172" text-anchor="middle" font-size="13" font-weight="800" fill="#080D18">C</text>
        <rect x="350" y="178" width="68" height="92" rx="6" fill="#FFFFFF" stroke="#080D18" stroke-width="1.3"/>
        <rect x="350" y="204" width="68" height="66" fill="#5B6472" fill-opacity=".5"/>
        <text x="384" y="290" text-anchor="middle" font-size="9" font-weight="600" fill="#5B6472">request = limit</text>

        <text x="88" y="330" font-size="13.5" font-weight="700" fill="#080D18">Same host, same kernel &mdash;</text>
        <text x="88" y="350" font-size="13.5" font-weight="700" fill="#080D18">three very different configs.</text>
        <text x="88" y="373" font-size="12.5" font-weight="600" fill="#5B6472">Nobody thinks about QoS class until today.</text>
      </g>

      <!-- ============ PANEL 2 · THE COMPLICATION (px=560, py=10) ============ -->
      <g font-family="Inter, sans-serif">
        <rect x="560" y="10" width="460" height="380" rx="14" fill="#FFFFFF" stroke="#080D18" stroke-opacity=".15" stroke-width="1.4"/>
        <text x="588" y="50" font-size="12.5" font-weight="800" letter-spacing=".06em" fill="#2F55E8">2 &middot; THE COMPLICATION</text>
        <text x="588" y="74" font-size="17" font-weight="800" fill="#080D18">Pod A starts growing</text>

        <rect x="590" y="92" width="400" height="160" rx="10" fill="#F1F3F7" stroke="#080D18" stroke-opacity=".35" stroke-width="1.3"/>
        <text x="602" y="140" font-size="9.5" font-weight="700" letter-spacing=".08em" fill="#5B6472">NODE</text>
        <rect x="600" y="100" width="380" height="8" rx="4" fill="#E3E7EF"/>
        <rect x="600" y="100" width="266" height="8" rx="4" fill="#2F55E8"/>
        <text x="980" y="107" text-anchor="end" font-size="9" font-weight="800" fill="#2F55E8">PRESSURE RISING</text>

        <!-- chip A: ballooning -->
        <text x="696" y="172" text-anchor="middle" font-size="13" font-weight="800" fill="#2F55E8">A</text>
        <rect x="662" y="178" width="68" height="92" rx="6" fill="#FFFFFF" stroke="#2F55E8" stroke-width="1.6"/>
        <rect x="662" y="178" width="68" height="92" rx="6" fill="#2F55E8" fill-opacity=".55"/>
        <text x="696" y="290" text-anchor="middle" font-size="9" font-weight="700" fill="#2F55E8">growing &mdash; no ceiling</text>

        <!-- chip B: steady -->
        <text x="790" y="172" text-anchor="middle" font-size="13" font-weight="800" fill="#080D18">B</text>
        <rect x="756" y="178" width="68" height="92" rx="6" fill="#FFFFFF" stroke="#080D18" stroke-width="1.3"/>
        <rect x="756" y="214" width="68" height="56" fill="#5B6472" fill-opacity=".5"/>
        <text x="790" y="290" text-anchor="middle" font-size="9" font-weight="600" fill="#5B6472">steady</text>

        <!-- chip C: steady -->
        <text x="884" y="172" text-anchor="middle" font-size="13" font-weight="800" fill="#080D18">C</text>
        <rect x="850" y="178" width="68" height="92" rx="6" fill="#FFFFFF" stroke="#080D18" stroke-width="1.3"/>
        <rect x="850" y="204" width="68" height="66" fill="#5B6472" fill-opacity=".5"/>
        <text x="884" y="290" text-anchor="middle" font-size="9" font-weight="600" fill="#5B6472">steady</text>

        <text x="588" y="330" font-size="13.5" font-weight="700" fill="#080D18">Pod A has no memory request &mdash;</text>
        <text x="588" y="350" font-size="13.5" font-weight="700" fill="#080D18">nothing stops it from growing.</text>
        <text x="588" y="373" font-size="12.5" font-weight="600" fill="#5B6472">The node's free memory keeps shrinking.</text>
      </g>

      <!-- ============ PANEL 3 · THE RECKONING (px=60, py=430) ============ -->
      <g font-family="Inter, sans-serif">
        <rect x="60" y="430" width="460" height="380" rx="14" fill="#FFFFFF" stroke="#080D18" stroke-opacity=".15" stroke-width="1.4"/>
        <text x="88" y="470" font-size="12.5" font-weight="800" letter-spacing=".06em" fill="#2F55E8">3 &middot; THE RECKONING</text>
        <text x="88" y="494" font-size="17" font-weight="800" fill="#080D18">kubelet starts its sweep</text>

        <rect x="90" y="512" width="400" height="160" rx="10" fill="#F1F3F7" stroke="#080D18" stroke-opacity=".35" stroke-width="1.3"/>
        <text x="102" y="560" font-size="9.5" font-weight="700" letter-spacing=".08em" fill="#5B6472">NODE</text>
        <rect x="100" y="520" width="380" height="8" rx="4" fill="#2F55E8"/>
        <text x="480" y="527" text-anchor="end" font-size="9" font-weight="800" fill="#2F55E8">THRESHOLD CROSSED</text>

        <!-- kubelet badge -->
        <circle cx="196" cy="512" r="15" fill="#080D18" stroke="#FFFFFF" stroke-width="3"/>
        <text x="196" y="517" text-anchor="middle" font-size="12" font-weight="800" fill="#FFFFFF">K</text>
        <line x1="196" y1="527" x2="196" y2="538" stroke="#080D18" stroke-width="1.3" stroke-dasharray="3 3"/>

        <!-- chip A: marked -->
        <text x="196" y="592" text-anchor="middle" font-size="13" font-weight="800" fill="#2F55E8">A</text>
        <rect x="162" y="598" width="68" height="92" rx="6" fill="#FFFFFF" stroke="#2F55E8" stroke-width="1.6"/>
        <rect x="162" y="598" width="68" height="92" fill="#2F55E8" fill-opacity=".22"/>
        <line x1="170" y1="606" x2="222" y2="682" stroke="#2F55E8" stroke-width="3"/>
        <line x1="222" y1="606" x2="170" y2="682" stroke="#2F55E8" stroke-width="3"/>
        <text x="196" y="710" text-anchor="middle" font-size="9" font-weight="800" fill="#2F55E8">marked for eviction</text>

        <!-- chip B: safe -->
        <text x="290" y="592" text-anchor="middle" font-size="13" font-weight="800" fill="#080D18">B</text>
        <rect x="256" y="598" width="68" height="92" rx="6" fill="#FFFFFF" stroke="#080D18" stroke-width="1.3"/>
        <rect x="256" y="634" width="68" height="56" fill="#5B6472" fill-opacity=".5"/>
        <text x="290" y="710" text-anchor="middle" font-size="9" font-weight="600" fill="#5B6472">not evaluated yet</text>

        <!-- chip C: safe -->
        <text x="384" y="592" text-anchor="middle" font-size="13" font-weight="800" fill="#080D18">C</text>
        <rect x="350" y="598" width="68" height="92" rx="6" fill="#FFFFFF" stroke="#080D18" stroke-width="1.3"/>
        <rect x="350" y="624" width="68" height="66" fill="#5B6472" fill-opacity=".5"/>
        <text x="384" y="710" text-anchor="middle" font-size="9" font-weight="600" fill="#5B6472">not evaluated yet</text>

        <text x="88" y="750" font-size="13.5" font-weight="700" fill="#080D18">kubelet ranks pods by QoS class</text>
        <text x="88" y="770" font-size="13.5" font-weight="700" fill="#080D18">first, usage second.</text>
        <text x="88" y="793" font-size="12.5" font-weight="600" fill="#5B6472">Pod A has no protection &mdash; it's first on the list.</text>
      </g>

      <!-- ============ PANEL 4 · THE AFTERMATH (px=560, py=430) ============ -->
      <g font-family="Inter, sans-serif">
        <rect x="560" y="430" width="460" height="380" rx="14" fill="#FFFFFF" stroke="#080D18" stroke-opacity=".15" stroke-width="1.4"/>
        <text x="588" y="470" font-size="12.5" font-weight="800" letter-spacing=".06em" fill="#2F55E8">4 &middot; THE AFTERMATH</text>
        <text x="588" y="494" font-size="17" font-weight="800" fill="#080D18">One pod gone, two still standing</text>

        <rect x="590" y="512" width="400" height="160" rx="10" fill="#F1F3F7" stroke="#080D18" stroke-opacity=".35" stroke-width="1.3"/>
        <text x="602" y="560" font-size="9.5" font-weight="700" letter-spacing=".08em" fill="#5B6472">NODE</text>
        <rect x="600" y="520" width="380" height="8" rx="4" fill="#E3E7EF"/>
        <rect x="600" y="520" width="140" height="8" rx="4" fill="#5B6472" fill-opacity=".55"/>
        <text x="980" y="527" text-anchor="end" font-size="9" font-weight="700" fill="#5B6472">pressure relieved</text>

        <!-- chip A: gone -->
        <text x="696" y="592" text-anchor="middle" font-size="13" font-weight="800" fill="#5B6472" opacity=".5">A</text>
        <rect x="662" y="598" width="68" height="92" rx="6" fill="none" stroke="#080D18" stroke-opacity=".3" stroke-width="1.3" stroke-dasharray="4 4"/>
        <text x="696" y="648" text-anchor="middle" font-size="10" font-weight="700" fill="#5B6472">GONE</text>
        <text x="696" y="710" text-anchor="middle" font-size="9" font-weight="700" fill="#2F55E8">evicted</text>

        <!-- chip B: survived -->
        <text x="790" y="592" text-anchor="middle" font-size="13" font-weight="800" fill="#080D18">B</text>
        <rect x="756" y="598" width="68" height="92" rx="6" fill="#FFFFFF" stroke="#080D18" stroke-width="1.3"/>
        <rect x="756" y="634" width="68" height="56" fill="#5B6472" fill-opacity=".5"/>
        <text x="790" y="710" text-anchor="middle" font-size="9" font-weight="600" fill="#5B6472">under its request</text>

        <!-- chip C: never at risk -->
        <text x="884" y="592" text-anchor="middle" font-size="13" font-weight="800" fill="#080D18">C</text>
        <rect x="850" y="598" width="68" height="92" rx="6" fill="#FFFFFF" stroke="#080D18" stroke-width="1.3"/>
        <rect x="850" y="624" width="68" height="66" fill="#5B6472" fill-opacity=".5"/>
        <text x="884" y="710" text-anchor="middle" font-size="9" font-weight="600" fill="#5B6472">never at risk</text>

        <text x="588" y="750" font-size="13.5" font-weight="700" fill="#080D18">B survives because it's under its</text>
        <text x="588" y="770" font-size="13.5" font-weight="700" fill="#080D18">request. C was never at risk.</text>
        <text x="588" y="793" font-size="12.5" font-weight="600" fill="#5B6472">The class isn't luck &mdash; it's what you wrote in the YAML.</text>
      </g>

    </svg>

    <figcaption>Four panels, one incident: the only difference between panel 1 and panel 4 is the <b>requests</b> and <b>limits</b> nobody set for Pod A.</figcaption>
  </figure>

  <div class="footer-row">
    <div class="wordmark">THE FINTECH ENGINEER</div>
    <div class="signature">linkedin.com/company/the-fintech-engineer</div>
  </div>

</div>
