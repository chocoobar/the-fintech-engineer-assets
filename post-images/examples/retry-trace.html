<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap">
<style>
  :root{
    --ink:#080D18;
    --signal:#2F55E8;
    --paper:#F1F3F7;
    --slate:#5B6472;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:#FFFFFF; }
  body{
    font-family:'Inter',ui-sans-serif,system-ui,sans-serif;
  }

  /* Flat, full-bleed export: no shadow, no radius, no surrounding margin —
     this IS the uploadable asset, edge to edge. */
  .card{
    width:1080px;
    margin:0 auto;
    background:var(--paper);
    color:var(--ink);
    padding:64px 66px 48px;
    display:flex;
    flex-direction:column;
    gap:30px;
  }

  .head-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:20px; }
  .head-copy{ display:flex; flex-direction:column; gap:10px; max-width:80%; }
  .card-eyebrow{ font-size:15px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--signal); }
  .card-h1{ font-size:31px; font-weight:800; line-height:1.22; letter-spacing:-.01em; color:var(--ink); text-wrap:balance; }
  .mark{ width:36px; height:36px; flex-shrink:0; margin-top:2px; }

  .diagram-wrap{ width:100%; }
  .diagram-wrap svg{ display:block; width:100%; height:auto; }
  figcaption{ margin-top:14px; font-size:17px; line-height:1.55; color:var(--slate); }
  figcaption b{ color:var(--ink); }
  figure{ margin:0; }

  .legend{ display:flex; gap:26px; flex-wrap:wrap; font-size:15px; font-weight:600; color:var(--slate); }
  .legend span{ display:inline-flex; align-items:center; gap:8px; }
  .legend svg{ width:30px; height:14px; overflow:visible; }

  .footer-row{
    display:flex; align-items:center; justify-content:space-between;
    padding-top:20px; border-top:1px solid rgba(8,13,24,.1);
  }
  .wordmark{ font-size:16px; font-weight:700; letter-spacing:.06em; color:var(--ink); }
  .signature{ font-size:16px; font-weight:500; color:var(--slate); }
</style>

<div class="card">

  <div class="head-row">
    <div class="head-copy">
      <div class="card-eyebrow">Request trace &middot; naive retry, no idempotency key</div>
      <div class="card-h1">Where ambiguity becomes a duplicate charge</div>
    </div>
    <svg class="mark" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"><g transform="matrix(7.111111111111111,0,0,7.111111111111111,-99.55555555555554,-99.55555555555554)"><g transform="rotate(0 50 50)"><path d="M57.0 14.0 H19.5 A5.5 5.5 0 0 0 14.0 19.5 V41.0 H25.0 V25.0 H57.0 Z" fill="#2F55E8"/></g><g transform="rotate(90 50 50)"><path d="M57.0 14.0 H19.5 A5.5 5.5 0 0 0 14.0 19.5 V41.0 H25.0 V25.0 H57.0 Z" fill="#080D18"/></g><g transform="rotate(180 50 50)"><path d="M57.0 14.0 H19.5 A5.5 5.5 0 0 0 14.0 19.5 V41.0 H25.0 V25.0 H57.0 Z" fill="#080D18"/></g><g transform="rotate(270 50 50)"><path d="M57.0 14.0 H19.5 A5.5 5.5 0 0 0 14.0 19.5 V41.0 H25.0 V25.0 H57.0 Z" fill="#080D18"/></g></g></svg>
  </div>

  <figure class="diagram-wrap">
    <svg viewBox="0 0 1080 800" role="img" aria-label="Sequence trace showing a client's payment request timing out on the response, the client retrying the identical request without an idempotency key, and the ledger posting the debit twice with no error raised anywhere.">

      <defs>
        <marker id="arrowSolid" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
          <path d="M0,0 L8,4 L0,8 Z" fill="#080D18"/>
        </marker>
        <marker id="arrowDash" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
          <path d="M0,0 L8,4 L0,8 Z" fill="#5B6472"/>
        </marker>
        <marker id="arrowDanger" markerWidth="10" markerHeight="10" refX="7" refY="4.5" orient="auto">
          <path d="M0,0 L8,4.5 L0,9 Z" fill="#2F55E8"/>
        </marker>
      </defs>

      <g font-family="Inter, sans-serif">
        <rect x="55" y="14" width="190" height="50" rx="9" fill="#FFFFFF" stroke="#080D18" stroke-width="1.4"/>
        <text x="150" y="36" text-anchor="middle" font-size="14" font-weight="700" fill="#080D18">Client App</text>
        <text x="150" y="53" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5B6472">mobile / web</text>

        <rect x="445" y="14" width="190" height="50" rx="9" fill="#FFFFFF" stroke="#080D18" stroke-width="1.4"/>
        <text x="540" y="36" text-anchor="middle" font-size="14" font-weight="700" fill="#080D18">Payment Gateway</text>
        <text x="540" y="53" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5B6472">your service</text>

        <rect x="835" y="14" width="190" height="50" rx="9" fill="#FFFFFF" stroke="#080D18" stroke-width="1.4"/>
        <text x="930" y="36" text-anchor="middle" font-size="14" font-weight="700" fill="#080D18">Core Ledger</text>
        <text x="930" y="53" text-anchor="middle" font-size="10.5" font-weight="500" fill="#5B6472">system of record</text>
      </g>

      <line x1="150" y1="64" x2="150" y2="700" stroke="#080D18" stroke-opacity=".25" stroke-width="1.5" stroke-dasharray="2 4"/>
      <line x1="540" y1="64" x2="540" y2="700" stroke="#080D18" stroke-opacity=".25" stroke-width="1.5" stroke-dasharray="2 4"/>
      <line x1="930" y1="64" x2="930" y2="700" stroke="#080D18" stroke-opacity=".25" stroke-width="1.5" stroke-dasharray="2 4"/>

      <g font-family="Inter, sans-serif">

        <line x1="150" y1="108" x2="536" y2="108" stroke="#080D18" stroke-width="1.8" marker-end="url(#arrowSolid)"/>
        <text x="345" y="98" text-anchor="middle" font-size="12.5" font-weight="600" fill="#080D18">POST /debit &#123;amount: 500&#125;</text>
        <text x="345" y="122" text-anchor="middle" font-size="10" font-weight="600" font-style="italic" fill="#5B6472">the miss: client never generates a key here</text>

        <line x1="540" y1="170" x2="926" y2="170" stroke="#080D18" stroke-width="1.8" marker-end="url(#arrowSolid)"/>
        <text x="735" y="160" text-anchor="middle" font-size="12.5" font-weight="600" fill="#080D18">debit(account, 500)</text>

        <line x1="930" y1="232" x2="544" y2="232" stroke="#5B6472" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrowDash)"/>
        <text x="735" y="222" text-anchor="middle" font-size="12.5" font-weight="600" fill="#5B6472">200 OK &middot; posted</text>

        <line x1="540" y1="296" x2="330" y2="296" stroke="#2F55E8" stroke-width="2" stroke-dasharray="6 5"/>
        <g transform="translate(310,296)">
          <line x1="-7" y1="-7" x2="7" y2="7" stroke="#2F55E8" stroke-width="2.4"/>
          <line x1="-7" y1="7" x2="7" y2="-7" stroke="#2F55E8" stroke-width="2.4"/>
        </g>
        <text x="480" y="286" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2F55E8">timeout &mdash; response lost in transit</text>

        <rect x="70" y="330" width="380" height="46" rx="8" fill="#FFFFFF" stroke="#080D18" stroke-opacity=".3" stroke-width="1.2" stroke-dasharray="3 4"/>
        <text x="260" y="349" text-anchor="middle" font-size="11.5" font-weight="600" fill="#080D18">No confirmation received &rarr;</text>
        <text x="260" y="365" text-anchor="middle" font-size="11.5" font-weight="600" fill="#080D18">client assumes the request failed</text>

        <line x1="150" y1="424" x2="533" y2="424" stroke="#2F55E8" stroke-width="2.6" marker-end="url(#arrowDanger)"/>
        <text x="345" y="405" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2F55E8">RETRY &middot; POST /debit &#123;amount: 500&#125;</text>
        <text x="345" y="420" text-anchor="middle" font-size="11" font-weight="600" fill="#2F55E8" opacity=".85">identical payload &middot; no idempotency key</text>

        <line x1="540" y1="480" x2="926" y2="480" stroke="#080D18" stroke-width="1.8" marker-end="url(#arrowSolid)"/>
        <text x="735" y="470" text-anchor="middle" font-size="12.5" font-weight="600" fill="#080D18">debit(account, 500)</text>

        <line x1="930" y1="542" x2="544" y2="542" stroke="#5B6472" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrowDash)"/>
        <text x="735" y="532" text-anchor="middle" font-size="12.5" font-weight="600" fill="#5B6472">200 OK &middot; posted (2nd time)</text>

        <line x1="540" y1="604" x2="154" y2="604" stroke="#5B6472" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrowDash)"/>
        <text x="345" y="594" text-anchor="middle" font-size="12.5" font-weight="600" fill="#5B6472">200 OK</text>

      </g>

      <rect x="70" y="644" width="940" height="60" rx="10" fill="#2F55E8" fill-opacity=".08" stroke="#2F55E8" stroke-width="1.4"/>
      <rect x="70" y="644" width="6" height="60" rx="3" fill="#2F55E8"/>
      <text x="100" y="670" font-size="13.5" font-weight="700" fill="#080D18">Ledger state: two valid postings, &minus;$1,000 total.</text>
      <text x="100" y="689" font-size="12" font-weight="600" fill="#5B6472">No exception thrown. No alert fired. Nothing here looks like a bug.</text>

    </svg>

    <figcaption>The break is at step 4: a lost response turns a completed debit into an <b>unknown</b> outcome. Step 6 is where the incident actually gets created &mdash; a retry that repeats the request instead of first asking the ledger what already happened.</figcaption>
  </figure>

  <div class="legend">
    <span><svg viewBox="0 0 22 10"><line x1="0" y1="5" x2="18" y2="5" stroke="#080D18" stroke-width="1.8" marker-end="url(#arrowSolid)"/></svg> request</span>
    <span><svg viewBox="0 0 22 10"><line x1="0" y1="5" x2="18" y2="5" stroke="#5B6472" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrowDash)"/></svg> response</span>
    <span><svg viewBox="0 0 22 10"><line x1="0" y1="5" x2="18" y2="5" stroke="#2F55E8" stroke-width="2.4" marker-end="url(#arrowDanger)"/></svg> the failure hop</span>
  </div>

  <div class="footer-row">
    <div class="wordmark">THE FINTECH ENGINEER</div>
    <div class="signature">linkedin.com/company/the-fintech-engineer</div>
  </div>

</div>
