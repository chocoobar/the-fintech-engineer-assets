<style>
  :root{
    --ink:#080D18;
    --signal:#2F55E8;
    --paper:#F1F3F7;
    --slate:#5B6472;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:#FFFFFF; }
  body{
    font-family:'Inter',ui-sans-serif,system-ui,sans-serif;
  }

  /* Flat, full-bleed export: no shadow, no radius, no surrounding margin —
     this IS the uploadable asset, edge to edge. Do not add a shadow/radius/
     outer padding back in — see README "Why the card is flat, not floating". */
  .doc{
    width:920px;
    margin:0 auto;
    background:var(--paper);
    color:var(--ink);
    padding:80px 84px 56px;
    display:flex;
    flex-direction:column;
    gap:34px;
  }

  .head-row{ display:flex; align-items:center; justify-content:space-between; }
  .card-eyebrow{ font-size:14px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--signal); }
  .mark{ width:32px; height:32px; }

  .quote{
    font-size:52px; font-weight:800; line-height:1.14; letter-spacing:-0.015em;
    text-wrap:balance; color:var(--ink); margin:0;
  }
  .quote::before{ content:"\201C"; color:var(--signal); }
  .quote::after{ content:"\201D"; color:var(--signal); }

  .lede{ font-size:20px; font-weight:600; line-height:1.5; color:var(--ink); margin:0; max-width:60ch; }

  .body-copy{ display:flex; flex-direction:column; gap:22px; font-size:18px; line-height:1.68; color:#1E2530; max-width:64ch; }
  .body-copy p{ margin:0; }
  .body-copy b{ color:var(--ink); }
  .body-copy em{ font-style:italic; color:var(--ink); }

  .fix-block{
    display:flex; flex-direction:column; gap:16px;
    background:rgba(47,85,232,0.07); border:1px solid rgba(47,85,232,0.22);
    border-radius:16px; padding:26px 28px;
  }
  .fix-block .fix-title{ font-size:17px; font-weight:700; color:var(--ink); }
  .fix-item{ display:flex; gap:12px; align-items:flex-start; }
  .fix-item .arrow{ color:var(--signal); font-weight:800; font-size:18px; line-height:1.6; flex-shrink:0; }
  .fix-item p{ margin:0; font-size:16.5px; line-height:1.6; color:#1E2530; }
  .fix-item b{ color:var(--ink); }

  .closer{ font-size:18px; line-height:1.6; color:var(--ink); font-weight:600; max-width:64ch; margin:0; }
  .tags{ font-size:15px; font-weight:600; color:var(--signal); letter-spacing:.01em; }

  .footer-row{
    display:flex; align-items:center; justify-content:space-between;
    padding-top:26px; border-top:1px solid rgba(8,13,24,.1);
  }
  .wordmark{ font-size:15px; font-weight:700; letter-spacing:.06em; color:var(--ink); }
  .signature{ font-size:15px; font-weight:500; color:var(--slate); }
</style>
