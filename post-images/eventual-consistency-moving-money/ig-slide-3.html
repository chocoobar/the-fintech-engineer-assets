<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap">
<style>
  :root{
    --ink:#080D18;
    --signal:#2F55E8;
    --paper:#F1F3F7;
    --slate:#5B6472;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:#FFFFFF; }
  body{ font-family:'Inter',ui-sans-serif,system-ui,sans-serif; }

  .slide{
    width:1080px;
    height:1080px;
    margin:0 auto;
    background:var(--ink);
    color:var(--paper);
    padding:56px 64px 48px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  .head-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:20px; }
  .mark{ width:34px; height:34px; flex-shrink:0; }
  .card-eyebrow{ font-size:14px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--signal); }
  .swipe{ font-size:13px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--signal); }

  .content{ flex:1; display:flex; flex-direction:column; justify-content:center; gap:22px; }

  .h1{ font-size:36px; font-weight:800; line-height:1.2; letter-spacing:-.01em; color:var(--paper); margin:0; text-wrap:balance; }

  .diagram-wrap svg{ display:block; width:100%; height:auto; }

  .footer-row{
    display:flex; align-items:center; justify-content:space-between;
    padding-top:18px; border-top:1px solid rgba(241,243,247,.14);
  }
  .wordmark{ font-size:16px; font-weight:700; letter-spacing:.06em; color:var(--paper); }
  .signature{ font-size:14px; font-weight:500; color:var(--slate); }
</style>

<div class="slide">

  <div class="head-row">
    <svg class="mark" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"><g transform="matrix(7.111111111111111,0,0,7.111111111111111,-99.55555555555554,-99.55555555555554)"><g transform="rotate(0 50 50)"><path d="M57.0 14.0 H19.5 A5.5 5.5 0 0 0 14.0 19.5 V41.0 H25.0 V25.0 H57.0 Z" fill="#2F55E8"/></g><g transform="rotate(90 50 50)"><path d="M57.0 14.0 H19.5 A5.5 5.5 0 0 0 14.0 19.5 V41.0 H25.0 V25.0 H57.0 Z" fill="#F1F3F7"/></g><g transform="rotate(180 50 50)"><path d="M57.0 14.0 H19.5 A5.5 5.5 0 0 0 14.0 19.5 V41.0 H25.0 V25.0 H57.0 Z" fill="#F1F3F7"/></g><g transform="rotate(270 50 50)"><path d="M57.0 14.0 H19.5 A5.5 5.5 0 0 0 14.0 19.5 V41.0 H25.0 V25.0 H57.0 Z" fill="#F1F3F7"/></g></g></svg>
    <div style="text-align:right; display:flex; flex-direction:column; gap:5px;">
      <div class="card-eyebrow">Eventual consistency &middot; 3/5</div>
      <div class="swipe">Swipe &rarr;</div>
    </div>
  </div>

  <div class="content">
    <p class="h1">Draw the boundary around invariants, not services.</p>

    <div class="diagram-wrap">
      <svg viewBox="0 0 1080 460" role="img" aria-label="A strongly consistent boundary containing transaction state, account balance, and idempotency keys feeds an outbox that fans out asynchronously to notifications, analytics, search, and reporting.">
        <defs>
          <marker id="a3" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto">
            <path d="M0,0 L7,3.5 L0,7 Z" fill="#F1F3F7"/>
          </marker>
          <marker id="a3e" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
            <path d="M0,0 L6,3 L0,6 Z" fill="#5B6472"/>
          </marker>
        </defs>

        <rect x="140" y="20" width="800" height="150" rx="16" fill="rgba(47,85,232,.14)" stroke="#2F55E8" stroke-width="2"/>
        <text x="540" y="48" text-anchor="middle" font-size="13" font-weight="800" letter-spacing=".07em" fill="#2F55E8">STRONGLY CONSISTENT</text>

        <rect x="180" y="66" width="230" height="82" rx="10" fill="rgba(255,255,255,.95)" stroke="#2F55E8" stroke-width="1.4"/>
        <text x="295" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#080D18">Transaction</text>
        <text x="295" y="133" text-anchor="middle" font-size="15" font-weight="700" fill="#080D18">state</text>

        <rect x="430" y="66" width="220" height="82" rx="10" fill="rgba(255,255,255,.95)" stroke="#2F55E8" stroke-width="1.4"/>
        <text x="540" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#080D18">Account</text>
        <text x="540" y="133" text-anchor="middle" font-size="15" font-weight="700" fill="#080D18">balance</text>

        <rect x="670" y="66" width="230" height="82" rx="10" fill="rgba(255,255,255,.95)" stroke="#2F55E8" stroke-width="1.4"/>
        <text x="785" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#080D18">Idempotency</text>
        <text x="785" y="133" text-anchor="middle" font-size="15" font-weight="700" fill="#080D18">keys</text>

        <line x1="540" y1="170" x2="540" y2="210" stroke="#F1F3F7" stroke-width="1.6" marker-end="url(#a3)"/>
        <rect x="440" y="212" width="200" height="52" rx="9" fill="rgba(241,243,247,.08)" stroke="#F1F3F7" stroke-width="1.3"/>
        <text x="540" y="244" text-anchor="middle" font-size="14" font-weight="700" fill="#F1F3F7">Outbox</text>

        <g stroke="#5B6472" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a3e)" fill="none">
          <path d="M480,266 L200,340"/>
          <path d="M510,266 L400,340"/>
          <path d="M570,266 L680,340"/>
          <path d="M600,266 L880,340"/>
        </g>

        <g font-size="13" font-weight="700" fill="#F1F3F7">
          <rect x="110" y="342" width="180" height="54" rx="9" fill="rgba(241,243,247,.06)" stroke="rgba(241,243,247,.3)" stroke-width="1.2"/>
          <text x="200" y="374" text-anchor="middle">Notifications</text>

          <rect x="310" y="342" width="180" height="54" rx="9" fill="rgba(241,243,247,.06)" stroke="rgba(241,243,247,.3)" stroke-width="1.2"/>
          <text x="400" y="374" text-anchor="middle">Analytics</text>

          <rect x="590" y="342" width="180" height="54" rx="9" fill="rgba(241,243,247,.06)" stroke="rgba(241,243,247,.3)" stroke-width="1.2"/>
          <text x="680" y="374" text-anchor="middle">Search</text>

          <rect x="790" y="342" width="180" height="54" rx="9" fill="rgba(241,243,247,.06)" stroke="rgba(241,243,247,.3)" stroke-width="1.2"/>
          <text x="880" y="374" text-anchor="middle">Reporting</text>
        </g>

        <text x="540" y="424" text-anchor="middle" font-size="12" font-weight="800" letter-spacing=".07em" fill="#5B6472">EVENTUALLY CONSISTENT &middot; CAN CATCH UP LATER</text>
      </svg>
    </div>
  </div>

  <div class="footer-row">
    <div class="wordmark">THE FINTECH ENGINEER</div>
    <div class="signature">thefintechengineer.substack.com</div>
  </div>

</div>
