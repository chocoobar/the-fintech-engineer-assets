<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap">
<style>
  :root{
    --ink:#080D18;
    --signal:#2F55E8;
    --paper:#F1F3F7;
    --slate:#5B6472;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:#FFFFFF; }
  body{ font-family:'Inter',ui-sans-serif,system-ui,sans-serif; }

  .slide{
    width:1080px;
    height:1080px;
    margin:0 auto;
    background:var(--ink);
    color:var(--paper);
    padding:56px 64px 48px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  .head-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:20px; }
  .mark{ width:34px; height:34px; flex-shrink:0; }
  .card-eyebrow{ font-size:14px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--signal); }
  .swipe{ font-size:13px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--signal); }

  .content{ flex:1; display:flex; flex-direction:column; justify-content:center; gap:26px; }

  .h1{ font-size:37px; font-weight:800; line-height:1.18; letter-spacing:-.01em; color:var(--paper); margin:0; text-wrap:balance; }

  .diagram-wrap svg{ display:block; width:100%; height:auto; }

  .punch{ font-size:24px; font-weight:700; line-height:1.35; margin:0; }
  .punch.paper{ color:var(--paper); }
  .punch.signal{ color:var(--signal); }

  .footer-row{
    display:flex; align-items:center; justify-content:space-between;
    padding-top:18px; border-top:1px solid rgba(241,243,247,.14);
  }
  .wordmark{ font-size:16px; font-weight:700; letter-spacing:.06em; color:var(--paper); }
  .signature{ font-size:14px; font-weight:500; color:var(--slate); }
</style>

<div class="slide">

  <div class="head-row">
    <svg class="mark" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"><g transform="matrix(7.111111111111111,0,0,7.111111111111111,-99.55555555555554,-99.55555555555554)"><g transform="rotate(0 50 50)"><path d="M57.0 14.0 H19.5 A5.5 5.5 0 0 0 14.0 19.5 V41.0 H25.0 V25.0 H57.0 Z" fill="#2F55E8"/></g><g transform="rotate(90 50 50)"><path d="M57.0 14.0 H19.5 A5.5 5.5 0 0 0 14.0 19.5 V41.0 H25.0 V25.0 H57.0 Z" fill="#F1F3F7"/></g><g transform="rotate(180 50 50)"><path d="M57.0 14.0 H19.5 A5.5 5.5 0 0 0 14.0 19.5 V41.0 H25.0 V25.0 H57.0 Z" fill="#F1F3F7"/></g><g transform="rotate(270 50 50)"><path d="M57.0 14.0 H19.5 A5.5 5.5 0 0 0 14.0 19.5 V41.0 H25.0 V25.0 H57.0 Z" fill="#F1F3F7"/></g></g></svg>
    <div style="text-align:right; display:flex; flex-direction:column; gap:5px;">
      <div class="card-eyebrow">Eventual consistency &middot; 2/5</div>
      <div class="swipe">Swipe &rarr;</div>
    </div>
  </div>

  <div class="content">
    <p class="h1">That&rsquo;s not a lagging replica &mdash; it&rsquo;s a broken invariant.</p>

    <div class="diagram-wrap">
      <svg viewBox="0 0 1080 420" role="img" aria-label="Instance A and Instance B both read a $10,000 balance at the same instant, along parallel lifelines. Both then commit a $7,000 withdrawal into the same balance lifeline, and the two commits land in a shared result: $14,000 approved against $10,000 available.">
        <defs>
          <marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto">
            <path d="M0,0 L7,3.5 L0,7 Z" fill="#F1F3F7"/>
          </marker>
          <marker id="a2s" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto">
            <path d="M0,0 L7,4 L0,8 Z" fill="#2F55E8"/>
          </marker>
        </defs>

        <rect x="30" y="20" width="220" height="56" rx="10" fill="rgba(241,243,247,.07)" stroke="#F1F3F7" stroke-width="1.3"/>
        <text x="140" y="45" text-anchor="middle" font-size="14.5" font-weight="700" fill="#F1F3F7">Instance A</text>
        <text x="140" y="64" text-anchor="middle" font-size="11" font-weight="500" fill="#5B6472">withdraw $7,000</text>

        <rect x="430" y="20" width="220" height="56" rx="10" fill="rgba(47,85,232,.14)" stroke="#2F55E8" stroke-width="1.6"/>
        <text x="540" y="45" text-anchor="middle" font-size="14.5" font-weight="800" fill="#F1F3F7">Account Balance</text>
        <text x="540" y="64" text-anchor="middle" font-size="11" font-weight="600" fill="#8FA3F0">$10,000</text>

        <rect x="830" y="20" width="220" height="56" rx="10" fill="rgba(241,243,247,.07)" stroke="#F1F3F7" stroke-width="1.3"/>
        <text x="940" y="45" text-anchor="middle" font-size="14.5" font-weight="700" fill="#F1F3F7">Instance B</text>
        <text x="940" y="64" text-anchor="middle" font-size="11" font-weight="500" fill="#5B6472">withdraw $7,000</text>

        <line x1="140" y1="76" x2="140" y2="330" stroke="#F1F3F7" stroke-opacity=".25" stroke-width="1.4" stroke-dasharray="2 4"/>
        <line x1="540" y1="76" x2="540" y2="330" stroke="#F1F3F7" stroke-opacity=".25" stroke-width="1.4" stroke-dasharray="2 4"/>
        <line x1="940" y1="76" x2="940" y2="330" stroke="#F1F3F7" stroke-opacity=".25" stroke-width="1.4" stroke-dasharray="2 4"/>

        <line x1="140" y1="112" x2="533" y2="112" stroke="#F1F3F7" stroke-width="1.4" marker-end="url(#a2)"/>
        <line x1="940" y1="112" x2="547" y2="112" stroke="#F1F3F7" stroke-width="1.4" marker-end="url(#a2)"/>
        <text x="340" y="102" text-anchor="middle" font-size="11.5" font-weight="700" fill="#F1F3F7">reads $10,000</text>
        <text x="740" y="102" text-anchor="middle" font-size="11.5" font-weight="700" fill="#F1F3F7">reads $10,000</text>

        <line x1="60" y1="158" x2="1020" y2="158" stroke="#5B6472" stroke-width="1.2" stroke-dasharray="4 4"/>
        <text x="540" y="150" text-anchor="middle" font-size="10.5" font-weight="700" fill="#5B6472" letter-spacing=".05em">SAME INSTANT</text>

        <line x1="140" y1="196" x2="533" y2="196" stroke="#2F55E8" stroke-width="2" marker-end="url(#a2s)"/>
        <line x1="940" y1="196" x2="547" y2="196" stroke="#2F55E8" stroke-width="2" marker-end="url(#a2s)"/>
        <text x="340" y="186" text-anchor="middle" font-size="12" font-weight="700" fill="#2F55E8">commit &minus;$7,000</text>
        <text x="740" y="186" text-anchor="middle" font-size="12" font-weight="700" fill="#2F55E8">commit &minus;$7,000</text>

        <rect x="340" y="256" width="400" height="76" rx="10" fill="rgba(47,85,232,.16)" stroke="#2F55E8" stroke-width="1.6"/>
        <text x="540" y="286" text-anchor="middle" font-size="14.5" font-weight="800" fill="#F1F3F7">Both commits succeed</text>
        <text x="540" y="310" text-anchor="middle" font-size="12.5" font-weight="600" fill="#8FA3F0">neither instance ever saw the other's write</text>
      </svg>
    </div>

    <p class="punch signal">$14,000 approved. $10,000 available. Nothing threw an error.</p>
  </div>

  <div class="footer-row">
    <div class="wordmark">THE FINTECH ENGINEER</div>
    <div class="signature">thefintechengineer.substack.com</div>
  </div>

</div>
